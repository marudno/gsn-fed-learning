[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retinopathy-fl"
version = "1.0.0"
description = "Federated diabetic retinopathy classification with Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]==1.30.0",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["retinopathy_fl"]

[tool.flwr.app]
publisher = "StaGlo"

[tool.flwr.app.components]
serverapp = "retinopathy_fl.server_app:app"
clientapp = "retinopathy_fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
local-epochs = 10
lr = 0.01
fraction-train = 1.0
model-type = "standard"     # "standard" or "bn"
strategy = "FedAvg"         # FedAvg, FedAdam, FedYogi, FedProx

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 3
options.backend.client-resources.num-gpus = 0.25 # GPU per client
