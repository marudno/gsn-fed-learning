[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retinopathy-fl"
version = "1.0.0"
description = "Federated diabetic retinopathy classification with Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]==1.30.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["retinopathy_fl"]

[tool.flwr.app]
publisher = "StaGlo"

[tool.flwr.app.components]
serverapp = "retinopathy_fl.server_app:app"
clientapp = "retinopathy_fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
local-epochs = 3
lr = 0.0001
fraction-train = 1.0
model-name = "efficientnet_b2"   # resnet18, resnet50, densenet121, efficientnet_b2, convnext_tiny, swin_tiny
strategy = "FedAvg"              # FedAvg, FedAdam, FedYogi, FedProx
partition-type = "iid"           # iid, dirichlet
dirichlet-alpha = 0.5            # used when partition-type = "dirichlet"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.client-resources.num-gpus = 0.2  # 5 clients × 0.2 = 1 GPU
